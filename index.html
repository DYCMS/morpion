<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morpion · À deux de jouer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10171d; color: #eef3f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px 18px; background: radial-gradient(ellipse at top, #213843, #10171d 65%); }
    main { width: min(100%, 440px); }
    .eyebrow { color: #a4bec9; font-size: .75rem; text-transform: uppercase; letter-spacing: .2em; }
    h1 { margin: 8px 0; font-size: clamp(2.5rem, 9vw, 3.5rem); letter-spacing: -.06em; }
    .intro { color: #b7c7ce; margin: 0 0 25px; line-height: 1.6; }
    .players { display: flex; gap: 12px; }
    .player { flex: 1; padding: 13px 15px; border: 1px solid #455861; border-radius: 12px; color: #b7c7ce; }
    .player.active { border-color: #b7f4b8; background: #b7f4b810; color: #eef3f5; }
    .symbol { font-weight: 800; margin-right: 9px; }
    .x { color: #b7f4b8; } .o { color: #ffc49b; }
    #status { min-height: 1.6em; margin: 23px 0 15px; font-size: 1.1rem; font-weight: 600; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .cell { aspect-ratio: 1; padding: 0; border: 1px solid #42555f; background: #1c2a33; border-radius: 14px; font: 700 clamp(2.2rem, 12vw, 4rem)/1 system-ui, sans-serif; cursor: pointer; transition: background .15s, border-color .15s; }
    .cell:not(:disabled):hover { background: #2b404c; border-color: #a4bec9; }
    .cell:disabled { cursor: default; opacity: 1; }
    .cell.winner { background: #354d37; border: 2px solid #b7f4b8; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    #restart { width: 100%; margin-top: 20px; padding: 15px; border: 0; border-radius: 12px; background: #b7f4b8; color: #14251b; font: 700 1rem system-ui, sans-serif; cursor: pointer; }
    #restart:hover { background: #d0ffd1; }
    .rules { color: #b7c7ce; font-size: .85rem; line-height: 1.6; text-align: center; margin: 20px 0 0; }
    noscript { display: block; padding: 15px; color: #ffc49b; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Deux joueurs · Un même écran</div>
    <h1>Morpion.</h1>
    <p class="intro">À deux de jouer. Qui trouvera le bon alignement ?</p>
    <div class="players" aria-label="Joueurs">
      <div class="player active" id="player-x"><span class="symbol x">X</span> Joueur 1</div>
      <div class="player" id="player-o"><span class="symbol o">O</span> Joueur 2</div>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">Au tour de X — Joueur 1</p>
    <div class="board" role="group" aria-label="Grille de morpion, trois lignes et trois colonnes"></div>
    <button id="restart" type="button">Nouvelle partie</button>
    <p class="rules">X commence. Jouez chacun votre tour dans une case libre.<br>Alignez 3 symboles en ligne, en colonne ou en diagonale.</p>
    <noscript>Activez JavaScript dans votre navigateur pour jouer.</noscript>
  </main>
  <script>
    'use strict';
    const board = document.querySelector('.board');
    const status = document.querySelector('#status');
    const players = [document.querySelector('#player-x'), document.querySelector('#player-o')];
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let squares = Array(9).fill('');
    let current = 'X';
    let ended = false;
    const cells = squares.map((_, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cell';
      button.addEventListener('click', () => play(i));
      board.append(button);
      return button;
    });
    function render(winningLine = []) {
      cells.forEach((button, i) => {
        button.textContent = squares[i];
        button.disabled = ended || squares[i] !== '';
        button.className = 'cell' + (squares[i] ? ' ' + squares[i].toLowerCase() : '') + (winningLine.includes(i) ? ' winner' : '');
        button.setAttribute('aria-label', `Ligne ${Math.floor(i / 3) + 1}, colonne ${i % 3 + 1} : ${squares[i] || 'vide'}`);
      });
      players[0].classList.toggle('active', !ended && current === 'X');
      players[1].classList.toggle('active', !ended && current === 'O');
    }
    function play(i) {
      if (ended || squares[i]) return;
      squares[i] = current;
      const winningLine = lines.find(line => line.every(index => squares[index] === current));
      if (winningLine) {
        ended = true;
        status.textContent = `${current} a gagné ! — Joueur ${current === 'X' ? 1 : 2}`;
      } else if (squares.every(Boolean)) {
        ended = true;
        status.textContent = 'Match nul ! Bien joué à tous les deux.';
      } else {
        current = current === 'X' ? 'O' : 'X';
        status.textContent = `Au tour de ${current} — Joueur ${current === 'X' ? 1 : 2}`;
      }
      render(winningLine);
    }
    document.querySelector('#restart').addEventListener('click', () => {
      squares = Array(9).fill('');
      current = 'X';
      ended = false;
      status.textContent = 'Au tour de X — Joueur 1';
      render();
      cells[0].focus();
    });
    render();
  </script>
</body>
</html>
